<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VibeAgent - Voice Companion</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #0b0f19 0%, #020408 100%);
      --accent-color: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --listening-color: #00f2fe;
      --listening-glow: rgba(0, 242, 254, 0.6);
      --speaking-color: #f43f5e;
      --speaking-glow: rgba(244, 63, 94, 0.6);
      --thinking-color: #eab308;
      --thinking-glow: rgba(234, 179, 8, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-gradient);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      perspective: 1000px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    /* Hologram Avatar Container */
    .hologram-stage {
      position: relative;
      width: 500px;
      height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    /* Rotating Tech Ring */
    .tech-ring {
      position: absolute;
      width: 440px;
      height: 440px;
      border: 2px dashed rgba(99, 102, 241, 0.2);
      border-radius: 50%;
      animation: rotateRing 25s infinite linear;
      pointer-events: none;
      transition: border-color 0.5s;
    }

    .hologram-stage:hover .tech-ring {
      animation-duration: 8s;
      border-color: rgba(99, 102, 241, 0.4);
    }

    /* Avatar Mask & Hologram Image */
    .holo-frame {
      position: relative;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      border: 3px solid var(--accent-color);
      box-shadow: 0 0 50px var(--accent-glow);
      overflow: hidden;
      cursor: pointer;
      z-index: 5;
      background-image: url('https://i.pinimg.com/736x/ba/04/38/ba0438c4923516d8b608478dc1fe16c8.jpg');
      background-size: cover;
      background-position: center;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .holo-frame:hover {
      transform: scale(1.04);
      box-shadow: 0 0 70px var(--accent-glow);
      filter: brightness(110%);
    }

    .holo-frame:active {
      transform: scale(0.96);
    }

    /* Hologram Scanlines Effect overlay */
    .holo-frame::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 242, 254, 0.15) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
      background-size: 100% 4px, 6px 100%;
      z-index: 10;
      opacity: 0.8;
      pointer-events: none;
    }

    /* Glowing waves expanding outwards */
    .holo-wave {
      position: absolute;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      border: 2px solid var(--accent-color);
      opacity: 0;
      pointer-events: none;
      z-index: 2;
    }

    /* Animated Digital Mouth Vocalizer Overlay */
    .mouth-wave {
      position: absolute;
      bottom: 31%;
      left: 51%;
      transform: translateX(-50%);
      width: 24px;
      height: 4px;
      background: var(--speaking-color);
      box-shadow: 0 0 12px var(--speaking-color), 0 0 4px #fff;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      z-index: 15;
      transition: opacity 0.3s, background 0.3s;
    }

    body.state-speaking .mouth-wave {
      opacity: 0.95;
      animation: talkMouth 0.12s infinite alternate ease-in-out;
    }

    @keyframes talkMouth {
      0% {
        height: 2px;
        width: 18px;
        transform: translateX(-50%) scaleY(0.5);
      }
      100% {
        height: 18px;
        width: 30px;
        border-radius: 40% 40% 50% 50%;
        transform: translateX(-50%) scaleY(1.2);
      }
    }

    /* Status Text */
    .status-lbl {
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      margin-top: 25px;
      transition: all 0.3s;
      user-select: none;
    }

    /* Glassmorphic keyboard button */
    .fallback-btn {
      margin-top: 20px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      color: #94a3b8;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      transition: all 0.3s;
      z-index: 20;
    }

    .fallback-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
    }

    /* Modal dialog for typing fallback */
    .text-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-content {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .modal-content h3 {
      margin-bottom: 15px;
      font-size: 1.2rem;
    }

    .modal-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #fff;
      font-family: inherit;
      margin-bottom: 15px;
      font-size: 1rem;
      outline: none;
    }

    .modal-input:focus {
      border-color: var(--accent-color);
    }

    .modal-btns {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .modal-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-submit {
      background: var(--accent-color);
      color: #fff;
    }

    .btn-cancel {
      background: transparent;
      color: #94a3b8;
    }

    /* Keyframe Animations */
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes wavePulse {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    @keyframes speakPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 50px var(--speaking-glow); }
      50% { transform: scale(1.06); box-shadow: 0 0 80px var(--speaking-color); }
    }

    /* State modifiers */
    body.state-disabled .holo-frame {
      border-color: #475569;
      box-shadow: 0 0 30px rgba(71, 85, 105, 0.3);
      filter: grayscale(100%) brightness(80%);
    }

    body.state-listening .holo-frame {
      border-color: var(--listening-color);
      box-shadow: 0 0 65px var(--listening-glow);
      filter: grayscale(0%) saturate(120%) brightness(105%);
    }
    body.state-listening .holo-wave {
      border-color: var(--listening-color);
      animation: wavePulse 1.6s infinite cubic-bezier(0.16, 1, 0.3, 1);
    }
    body.state-listening .status-lbl {
      color: var(--listening-color);
      text-shadow: 0 0 12px var(--listening-glow);
    }

    body.state-thinking .holo-frame {
      border-color: var(--thinking-color);
      box-shadow: 0 0 65px var(--thinking-glow);
      transform: scale(0.96);
    }
    body.state-thinking .tech-ring {
      border-color: var(--thinking-color);
      animation: rotateRing 3s infinite linear;
    }
    body.state-thinking .status-lbl {
      color: var(--thinking-color);
    }

    body.state-speaking .holo-frame {
      border-color: var(--speaking-color);
      animation: speakPulse 1s infinite ease-in-out;
      filter: grayscale(0%) saturate(130%) brightness(110%);
    }
    body.state-speaking .holo-wave {
      border-color: var(--speaking-color);
      animation: wavePulse 1.1s infinite ease-out;
    }
    body.state-speaking .status-lbl {
      color: var(--speaking-color);
      text-shadow: 0 0 12px var(--speaking-glow);
    }

    /* Lens Flare lighting effect */
    .lens-flare {
      position: absolute;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.04) 0%, transparent 60%);
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body class="state-disabled">

  <div class="lens-flare"></div>

  <div class="container">
    <div class="hologram-stage">
      <div class="tech-ring"></div>
      <div class="holo-wave"></div>
      <div class="holo-frame" id="holoFrame" onclick="toggleHologram()"></div>
      <div class="mouth-wave"></div>
    </div>
    
    <div class="status-lbl" id="statusLabel">Offline</div>
    
    <button class="fallback-btn" onclick="openTextModal()">⌨️ Type Command</button>
  </div>

  <!-- Text Input Modal Dialog -->
  <div class="text-modal" id="textModal">
    <div class="modal-content">
      <h3>Command Panel</h3>
      <input type="text" class="modal-input" id="modalInput" placeholder="e.g. google cat videos..." />
      <div class="modal-btns">
        <button class="modal-btn btn-cancel" onclick="closeTextModal()">Cancel</button>
        <button class="modal-btn btn-submit" onclick="submitTextCommand()">Submit</button>
      </div>
    </div>
  </div>

  <script>
    const frame = document.getElementById('holoFrame');
    const statusLabel = document.getElementById('statusLabel');
    const modal = document.getElementById('textModal');
    const mInput = document.getElementById('modalInput');

    let active = false;
    let isSpeaking = false;
    let recognition = null;
    let micSupported = false;

    // Initialize speech recognition
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (Recognition) {
      recognition = new Recognition();
      recognition.lang = 'en-US';
      recognition.continuous = false;
      micSupported = true;

      recognition.onstart = () => {
        if (active && !isSpeaking) {
          setUIState('listening');
        }
      };

      recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        if (!transcript.trim()) return;
        
        setUIState('thinking');
        await processCommand(transcript);
      };

      recognition.onerror = (e) => {
        console.log("Recognition error:", e.error);
        if (e.error === 'not-allowed') {
          console.warn("Microphone access denied. Falling back to keyboard interactions.");
        }
      };

      recognition.onend = () => {
        if (active && !isSpeaking) {
          try {
            recognition.start();
          } catch(e) {}
        }
      };
    }

    function setUIState(state) {
      document.body.className = '';
      if (state === 'disabled') {
        document.body.classList.add('state-disabled');
        statusLabel.textContent = 'Offline';
      } else if (state === 'listening') {
        document.body.classList.add('state-listening');
        statusLabel.textContent = 'Listening';
      } else if (state === 'thinking') {
        document.body.classList.add('state-thinking');
        statusLabel.textContent = 'Processing';
      } else if (state === 'speaking') {
        document.body.classList.add('state-speaking');
        statusLabel.textContent = 'Active';
      }
    }

    function toggleHologram() {
      // Toggle session state
      active = !active;

      if (active) {
        setUIState('listening');
        speak("System online. Ready to help.");
        
        // Start microphone if supported and permitted
        if (micSupported && recognition) {
          try {
            recognition.start();
          } catch(e) {
            console.log("Mic failed to start automatically:", e);
          }
        } else {
          // If no mic support, pop up the text box to make it instantly interactive
          setTimeout(openTextModal, 1500);
        }
      } else {
        setUIState('disabled');
        window.speechSynthesis.cancel();
        if (recognition) {
          recognition.stop();
        }
      }
    }

    async function processCommand(text) {
      try {
        const res = await fetch('/command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        speak(data.result);
      } catch (err) {
        console.error("Fetch error:", err);
        speak("Connection lost.");
      }
    }

    function speak(text) {
      if (!window.speechSynthesis) return;

      window.speechSynthesis.cancel();

      const cleanText = text.replace(/[*_`#]/g, '').replace(/got_it:\{\}/g, '');
      const utter = new SpeechSynthesisUtterance(cleanText);
      
      utter.onstart = () => {
        isSpeaking = true;
        setUIState('speaking');
        if (recognition) {
          recognition.stop();
        }
      };

      utter.onend = () => {
        isSpeaking = false;
        if (active) {
          setUIState('listening');
          if (recognition && micSupported) {
            try { recognition.start(); } catch(e) {}
          }
        } else {
          setUIState('disabled');
        }
      };

      utter.onerror = () => {
        isSpeaking = false;
        if (active) {
          setUIState('listening');
          if (recognition && micSupported) {
            try { recognition.start(); } catch(e) {}
          }
        }
      };

      window.speechSynthesis.speak(utter);
    }

    // Modal Control Functions
    function openTextModal() {
      modal.style.display = 'flex';
      mInput.focus();
      if (recognition) {
        recognition.stop(); // Stop mic while typing
      }
    }

    function closeTextModal() {
      modal.style.display = 'none';
      mInput.value = '';
      if (active && !isSpeaking && recognition && micSupported) {
        try { recognition.start(); } catch(e) {}
      }
    }

    async function submitTextCommand() {
      const text = mInput.value.trim();
      if (!text) return;
      
      closeTextModal();
      
      // Mark session as active if it was offline
      if (!active) {
        active = true;
      }
      
      setUIState('thinking');
      await processCommand(text);
    }

    // Enter Key triggers submission
    mInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitTextCommand();
    });
  </script>
</body>
</html>
