<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ishaq - Software Developer Portfolio</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #131c31;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-muted: #94a3b8;
        }
        body {
            background: linear-gradient(135deg, #090d16 0%, #1a102f 100%);
            background-attachment: fixed;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
            background: rgba(15, 23, 42, 0.9);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }
        nav a {
            color: var(--text-color);
            text-decoration: none;
            margin-left: 2rem;
            transition: color 0.3s;
        }
        nav a:hover {
            color: var(--accent-color);
        }
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 70vh;
            padding: 0 1rem;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-color);
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
            transition: transform 0.3s;
        }
        .profile-img:hover {
            transform: scale(1.05);
        }
        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }
        .hero h1 span {
            color: var(--accent-color);
        }
        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: var(--bg-color);
            padding: 0.75rem 2rem;
            border-radius: 5px;
            font-weight: bold;
            text-decoration: none;
            transition: background-color 0.3s, transform 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }
        section {
            padding: 5rem 10%;
        }
        section h2 {
            font-size: 2.5rem;
            margin-bottom: 3rem;
            text-align: center;
            color: var(--accent-color);
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        .project-card {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 10px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .project-card h3 {
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }
        .project-card p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }
        .interactive-box {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 10px;
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
        }
        .interactive-box p {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: var(--accent-color);
        }
        footer {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            background-color: var(--card-bg);
        }
    
        .project-card {
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .project-card::after {
            content: 'Click to view';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(56, 189, 248, 0.9);
            color: var(--bg-color);
            text-align: center;
            font-weight: bold;
            padding: 0.5rem;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        .project-card:hover::after {
            transform: translateY(0);
        }
        .contact-section {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 3rem;
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border-radius: 5px;
            border: 1px solid var(--text-muted);
            background: var(--bg-color);
            color: var(--text-color);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        .close-btn {
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 0.5rem 1rem;
            margin-top: 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .skill-badge {
            background-color: var(--card-bg);
            color: var(--accent-color);
            padding: 0.75rem 1.5rem;
            border-radius: 30px;
            font-weight: bold;
            border: 1px solid rgba(56, 189, 248, 0.3);
            transition: all 0.3s ease;
        }
        .skill-badge:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            transform: scale(1.05);
        }
        .theme-toggle {
            background: none;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 1rem;
            transition: all 0.3s;
        }
        .theme-toggle:hover {
            background: var(--accent-color);
            color: var(--bg-color);
        }
        body.light-theme {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #475569;
            --accent-color: #0284c7;
        }
</style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [likes, setLikes] = React.useState(0);

            return (
                <div>
                    <header>
                        <div className="logo">Ishaq.dev</div>
                        <nav>
                            <a href="#about">About</a>
                            <a href="#projects">Projects</a>
                            <a href="#contact">Contact</a>
                        <button class="theme-toggle" onclick="toggleTheme()">Light Mode</button>
        </nav>
                    </header>

                    <section className="hero">
                        <img 
                            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" 
                            alt="Ishaq Profile" 
                            className="profile-img" 
                        />
                        <h1>Hi, I'm <span>Ishaq</span></h1>
                        <p>A passionate software developer building robust and scalable applications with clean code and modern technologies.</p>
                        <a href="#projects" className="btn">View My Work</a>
                    </section>

                    
    <section id="skills">
        <h2>Technical Skills</h2>
        <div class="skills-container">
            <div class="skill-badge">JavaScript / TypeScript</div>
            <div class="skill-badge">React & Next.js</div>
            <div class="skill-badge">Node.js & Express</div>
            <div class="skill-badge">Python & Django</div>
            <div class="skill-badge">SQL & NoSQL Databases</div>
            <div class="skill-badge">Docker & Git</div>
            <div class="skill-badge">REST & GraphQL APIs</div>
        </div>
    </section>

    <section id="projects">
                        <h2>Featured Projects</h2>
                        <div className="projects-grid">
                            <div className="project-card">
                               <h3>Project One</h3>
                                <p>A full-stack web application built with modern technologies to solve real-world user problems seamlessly.</p>
                                <a href="#projects" className="btn">Source Code</a>
                            </div>
                            <div className="project-card">
                                <h3>Project Two</h3>
                                <p>An efficient cloud-native service designed for high performance, reliability, and smooth user experience.</p>
                                <a href="#projects" className="btn">Source Code</a>
                            </div>
                            <div className="project-card">
                                <h3>Project Three</h3>
                                <p>An interactive developer tool showcasing advanced algorithmic logic and intuitive user interface design.</p>
                                <a href="#projects" className="btn">Source Code</a>
                            </div>
                        </div>
                    </section>

                    <section>
                        <h2>Interactive Zone</h2>
                        <div className="interactive-box">
                            <p>Liked this portfolio? Show some love!</p>
                            <button className="btn" onClick={() => setLikes(likes + 1)}>
                                ❤️ Likes: {likes}
                            </button>
                        </div>
                    </section>

                    
    <section id="contact">
        <h2>Get In Touch</h2>
        <div class="contact-section">
            <form onsubmit="event.preventDefault(); alert('Thank you for your message, Ishaq! Message sent successfully.');">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Your Email</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="4" placeholder="Write your message" required></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">Send Message</button>
            </form>
        </div>
    </section>

    <footer>
                        <p>&copy; 2025 Ishaq. All rights reserved.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>

    <script>
        function openModal(title, desc) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('project-modal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('project-modal').style.display = 'none';
        }
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.project-card');
            cards.forEach((card, index) => {
                card.addEventListener('click', () => {
                    const title = card.querySelector('h3').innerText;
                    const desc = card.querySelector('p').innerText;
                    openModal(title, desc + ' (Interactive demo details loaded successfully!)');
                });
            });
        });
    </script>
    <div id="project-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title" style="color: var(--accent-color); margin-bottom: 1rem;"></h3>
            <p id="modal-desc" style="color: var(--text-muted); margin-bottom: 1.5rem;"></p>
            <button class="close-btn" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const btn = document.querySelector('.theme-toggle');
            if(document.body.classList.contains('light-theme')) {
                btn.innerText = 'Dark Mode';
            } else {
                btn.innerText = 'Light Mode';
            }
        }
    </script>
</body>
</html>
